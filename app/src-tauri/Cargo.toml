[package]
name = "fabiodb"
version = "0.1.0"
description = "A fast, calm Postgres & SQLite client"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
# Distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "fabiodb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fabiodb-core = { path = "../../crates/fabiodb-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["sync"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-window-state = "2"

# Bookmarks find a linked DBML file after its folder is moved or renamed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }
