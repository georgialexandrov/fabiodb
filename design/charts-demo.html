<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fabio — charts on results (demo)</title>
<style>
:root {
  color-scheme: light;
  --bg: #fbfaf8; --sidebar: #f3f1ed; --surface: #ffffff; --text: #2b2a28; --muted: #8d8a85;
  --line: #ebe8e3; --hover: #ebe8e2; --accent: #d9534f; --accent-soft: #d9534f1f;
  --mark: #6b6660; --grid: #efece7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1f1f1f; --sidebar: #262625; --surface: #2a2a29; --text: #e6e4e0; --muted: #8a8782;
  --line: #353432; --hover: #32312f; --accent-soft: #d9534f33;
  --mark: #b9b5ae; --grid: #333230;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
aside { background: var(--sidebar); padding: 18px 10px; border-right: 1px solid var(--line); overflow: auto; }
aside h1 { font-size: 13px; margin: 0 8px 2px; }
aside p.muted { margin: 0 8px 14px; }
.muted { color: var(--muted); }
.q { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 8px; border-radius: 6px; cursor: default; }
.q:hover { background: var(--hover); }
.q.active { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
.q small { display: block; color: var(--muted); }
main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
pre.sql { margin: 0; padding: 14px 20px; font: 12px/1.5 var(--mono); background: var(--surface); border-bottom: 1px solid var(--line); white-space: pre-wrap; }
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sidebar); border-radius: 7px; padding: 2px; }
.seg button { border: 0; background: none; font: inherit; color: var(--text); padding: 3px 11px; border-radius: 5px; }
.seg button.on { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.seg button:disabled { color: var(--muted); opacity: .5; }
label { color: var(--muted); }
select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }
.why { padding: 10px 20px 0; }
.why b { font-weight: 600; }
.stage { flex: 1; overflow: auto; padding: 6px 20px 20px; position: relative; }
.title { font-weight: 600; font-size: 14px; margin: 8px 0 2px; }
.legend { display: flex; gap: 14px; margin: 4px 0 6px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
svg { display: block; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .label { fill: var(--text); }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; box-shadow: 0 4px 16px #0000001a; font-variant-numeric: tabular-nums; display: none; z-index: 5; max-width: 280px; }
.tip .k { color: var(--muted); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); }
.hero { font-size: 52px; font-weight: 600; letter-spacing: -1px; margin: 40px 0 0; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
th, td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.num { text-align: right; }
details { padding: 0 20px 14px; }
details pre { font: 11px/1.45 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
summary { color: var(--muted); }
.theme { margin-left: auto; }
</style>
</head>
<body>
<aside>
  <h1>Charts on results</h1>
  <p class="muted">A demo on Chinook. Pick a query; Fabio picks the chart from the column types.</p>
  <div id="list"></div>
</aside>
<main>
  <pre class="sql" id="sql"></pre>
  <div class="bar">
    <div class="seg" id="forms"></div>
    <span id="pickers"></span>
    <div class="seg theme" id="theme"></div>
  </div>
  <div class="why" id="why"></div>
  <div class="stage" id="stage"></div>
  <details><summary>Saved with the query (what an agent gets back through MCP)</summary><pre id="spec"></pre></details>
</main>
<div class="tip" id="tip"></div>

// ---- The part that becomes chartSpec.ts in the app: types in, spec out. ----
const kind = (t) =>
  /^(int|smallint|bigint|numeric|decimal|real|double|float|money|serial)/i.test(t) ? "number"
  : /^(date|timestamp)/i.test(t) ? "time" : "text";

function pick(columns) {
  const k = columns.map(([, t]) => kind(t));
  const idx = (w) => k.flatMap((x, i) => (x === w ? [i] : []));
  const [nums, times, texts] = [idx("number"), idx("time"), idx("text")];
  const name = (i) => columns[i][0];
  if (!nums.length) return { form: "table", why: "Nothing to chart: there's no number column." };
  if (columns.length === 1) return { form: "value", y: nums[0], why: `One number, so it's shown as a number.` };
  if (times.length)
    return { form: "line", x: times[0], y: nums[0], series: texts[0] ?? null,
      why: `<b>Line</b>: ${name(times[0])} is a ${columns[times[0]][1]}, so time runs along the bottom` +
        (texts.length ? `, one line per ${name(texts[0])}.` : ".") };
  if (nums.length >= 2)
    return { form: "scatter", x: nums[0], y: nums[1], label: texts[0] ?? null,
      why: `<b>Scatter</b>: two numbers, ${name(nums[0])} against ${name(nums[1])}` + (texts.length ? `; hover a point for its ${name(texts[0])}.` : ".") };
  return { form: "bar", x: texts[0], y: nums[0],
    why: `<b>Bar</b>: one ${name(nums[0])} per ${name(texts[0])}, in the order the query returned them.` };
}

function allowed(form, columns) {
  const k = columns.map(([, t]) => kind(t));
  const n = k.filter((x) => x === "number").length;
  if (form === "table") return true;
  if (form === "line") return n >= 1 && k.some((x) => x === "time" || x === "number") && columns.length > 1;
  if (form === "bar") return n >= 1 && columns.length > 1;
  if (form === "scatter") return n >= 2;
  return false;
}

function ticks(max, count = 5) {
  const raw = max / count, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
  const out = []; for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out.at(-1) < max) out.push(out.at(-1) + step);
  return out;
}
const el = (tag, attrs = {}, text) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [a, v] of Object.entries(attrs)) n.setAttribute(a, v); if (text != null) n.textContent = text; return n; };

let state = { q: 0, spec: null };

function render() {
  const Q = QUERIES[state.q], s = state.spec, stage = $("stage");
  stage.innerHTML = ""; hideTip();
  $("sql").textContent = Q.sql;
  $("why").innerHTML = `<span class="muted">${s.why}</span>`;
  $("spec").textContent = JSON.stringify({ sql: Q.sql.replace(/\s+/g, " "), chart: specOut(Q, s) }, null, 2);
  renderForms(Q); renderPickers(Q);
  ({ line: drawLine, bar: drawBar, scatter: drawScatter, value: drawValue, table: drawTable })[s.form](stage, Q, s);
}
function specOut(Q, s) {
  const n = (i) => (i == null ? undefined : Q.columns[i][0]);
  return { form: s.form, x: n(s.x), y: n(s.y), series: n(s.series), label: n(s.label) };
}

function renderForms(Q) {
  const f = $("forms"); f.innerHTML = "";
  for (const form of ["line", "bar", "scatter", "table"]) {
    const b = document.createElement("button");
    b.textContent = form[0].toUpperCase() + form.slice(1);
    b.className = state.spec.form === form || (form === "table" && state.spec.form === "value") ? "on" : "";
    b.disabled = !allowed(form, Q.columns);
    if (b.disabled) b.title = form === "scatter" ? "Needs two number columns" : "Needs a number column";
    b.onclick = () => { state.spec = reshape(Q, form); render(); };
    f.append(b);
  }
}
// Switching form keeps the columns the reader chose where they still fit.
function reshape(Q, form) {
  const k = Q.columns.map(([, t]) => kind(t)), s = state.spec;
  const nums = k.flatMap((x, i) => (x === "number" ? [i] : []));
  const other = k.findIndex((x) => x !== "number");
  if (form === "table") return { ...s, form, why: "The rows as they came back." };
  if (form === "scatter") return { form, x: nums[0], y: nums[1], label: k.indexOf("text") >= 0 ? k.indexOf("text") : null, why: `<b>Scatter</b>, chosen by you.` };
  const x = s.x != null && s.x !== s.y ? s.x : other >= 0 ? other : nums[0];
  const y = nums.find((i) => i !== x) ?? nums[0];
  return { form, x, y, series: form === "line" ? s.series ?? null : null, why: `<b>${form[0].toUpperCase() + form.slice(1)}</b>, chosen by you.` };
}

function renderPickers(Q) {
  const p = $("pickers"), s = state.spec; p.innerHTML = "";
  if (!["line", "bar", "scatter"].includes(s.form)) return;
  const sel = (label, key, filter, none) => {
    const w = document.createElement("label"); w.textContent = label + " ";
    const se = document.createElement("select");
    if (none) se.append(new Option("—", ""));
    Q.columns.forEach(([n, t], i) => filter(kind(t)) && se.append(new Option(n, i)));
    se.value = s[key] ?? ""; se.onchange = () => { s[key] = se.value === "" ? null : +se.value; s.why = s.why.replace(/:.*|, chosen.*/, ", chosen by you."); render(); };
    w.append(se); p.append(w, " ");
  };
  sel("x", "x", (k) => s.form !== "scatter" || k === "number");
  sel("y", "y", (k) => k === "number");
  if (s.form === "line") sel("per", "series", (k) => k === "text", true);
}

function frame(stage, h) {
  const W = Math.max(480, stage.clientWidth - 40);
  const svg = el("svg", { width: W, height: h }); stage.append(svg); return [svg, W];
}

function drawLine(stage, Q, s) {
  const isTime = kind(Q.columns[s.x][1]) === "time";
  const xv = (r) => (isTime ? +new Date(r[s.x]) : +r[s.x]);
  // Group into series; more than three folds to the three largest.
  let groups = new Map();
  for (const r of Q.rows) { const key = s.series == null ? Q.columns[s.y][0] : r[s.series]; (groups.get(key) ?? groups.set(key, []).get(key)).push(r); }
  let names = [...groups.keys()], folded = 0;
  if (names.length > 3) { const tot = (n) => groups.get(n).reduce((a, r) => a + +r[s.y], 0);
    const keep = [...names].sort((a, b) => tot(b) - tot(a)).slice(0, 3); folded = names.length - 3; names = names.filter((n) => keep.includes(n)); }
  const multi = s.series != null;
  const title = document.createElement("div"); title.className = "title";
  title.textContent = `${Q.columns[s.y][0]} by ${Q.columns[s.x][0]}` + (multi ? `, per ${Q.columns[s.series][0]}` : ""); stage.append(title);
  if (multi) { const lg = document.createElement("div"); lg.className = "legend";
    names.forEach((n, i) => { const sp = document.createElement("span"); sp.style.setProperty("--c", SERIES[i]); sp.textContent = n; lg.append(sp); });
    if (folded) lg.append(Object.assign(document.createElement("span"), { className: "muted", textContent: `${folded} more in the table`, style: "--c: transparent" }));
    stage.append(lg); }
  const H = 340, m = { l: 56, r: multi ? 70 : 16, t: 10, b: 28 };
  const [svg, W] = frame(stage, H);
  const all = names.flatMap((n) => groups.get(n));
  const xs = all.map(xv), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yt = ticks(Math.max(...all.map((r) => +r[s.y])));
  const X = (v) => m.l + ((v - x0) / (x1 - x0 || 1)) * (W - m.l - m.r);
  const Y = (v) => H - m.b - (v / yt.at(-1)) * (H - m.t - m.b);
  for (const t of yt) { svg.append(el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t ? "var(--grid)" : "var(--line)" }));
    svg.append(el("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, fmt(t))); }
  const uniqX = [...new Set(xs)].sort((a, b) => a - b), every = Math.ceil(uniqX.length / 8);
  uniqX.forEach((v, i) => i % every === 0 && svg.append(el("text", { x: X(v), y: H - 8, "text-anchor": "middle" }, isTime ? fmtDate(v) : fmt(v))));
  const ends = [];
  names.forEach((n, i) => {
    const pts = groups.get(n).map((r) => [X(xv(r)), Y(+r[s.y])]);
    svg.append(el("path", { d: "M" + pts.map((p) => p.join(",")).join("L"), fill: "none", stroke: multi ? SERIES[i] : "var(--mark)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (multi) ends.push({ n, x: pts.at(-1)[0] + 8, y: pts.at(-1)[1] + 4 });
  });
  // End labels: nudged apart so two lines ending close together stay readable.
  ends.sort((a, b) => a.y - b.y).forEach((l, i, a) => { if (i && l.y - a[i - 1].y < 13) l.y = a[i - 1].y + 13; svg.append(el("text", { x: l.x, y: l.y, class: "label" }, l.n)); });
  // Crosshair: nearest x, every series at it.
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "2 3", visibility: "hidden" }); svg.append(cross);
  const dots = names.map((_, i) => { const d = el("circle", { r: 4.5, fill: multi ? SERIES[i] : "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }); svg.append(d); return d; });
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }); svg.append(hit);
  hit.onmousemove = (e) => {
    const px = e.offsetX, v = uniqX.reduce((a, b) => (Math.abs(X(b) - px) < Math.abs(X(a) - px) ? b : a));
    cross.setAttribute("x1", X(v)); cross.setAttribute("x2", X(v)); cross.setAttribute("visibility", "visible");
    let html = `<div class="k">${isTime ? fmtDate(v) : fmt(v)}</div>`;
    names.forEach((n, i) => { const r = groups.get(n).find((r) => xv(r) === v);
      dots[i].setAttribute("visibility", r ? "visible" : "hidden");
      if (r) { dots[i].setAttribute("cx", X(v)); dots[i].setAttribute("cy", Y(+r[s.y]));
        html += `<div><i style="--c:${multi ? SERIES[i] : "var(--accent)"}"></i>${multi ? n + " " : ""}<b>${fmt(r[s.y])}</b></div>`; } });
    showTip(e, html);
  };
  hit.onmouseleave = () => { hideTip(); cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); };
}

function drawBar(stage, Q, s) {
  const CAP = 40, rows = Q.rows.slice(0, CAP);
  const title = document.createElement("div"); title.className = "title";
  title.textContent = `${Q.columns[s.y][0]} by ${Q.columns[s.x][0]}`; stage.append(title);
  if (Q.rows.length > CAP) stage.append(Object.assign(document.createElement("div"), { className: "muted", textContent: `The first ${CAP} of ${Q.rows.length} rows; the rest are in the table.` }));
  const band = 22, m = { l: 150, r: 60, t: 22, b: 6 }, H = m.t + rows.length * band + m.b;
  const [svg, W] = frame(stage, H);
  const xt = ticks(Math.max(...rows.map((r) => +r[s.y])));
  const X = (v) => m.l + (v / xt.at(-1)) * (W - m.l - m.r);
  for (const t of xt) { svg.append(el("line", { x1: X(t), x2: X(t), y1: m.t - 4, y2: H - m.b, stroke: t ? "var(--grid)" : "var(--line)" }));
    svg.append(el("text", { x: X(t), y: 12, "text-anchor": "middle" }, fmt(t))); }
  rows.forEach((r, i) => {
    const y = m.t + i * band + 2, h = band - 4, w = Math.max(1, X(+r[s.y]) - m.l), rad = Math.min(4, w);
    const label = String(r[s.x] ?? "NULL");
    svg.append(el("text", { x: m.l - 8, y: y + h / 2 + 4, "text-anchor": "end", class: "label" }, label.length > 22 ? label.slice(0, 21) + "…" : label));
    // Square at the baseline, rounded at the data end.
    const bar = el("path", { d: `M${m.l},${y}h${w - rad}a${rad},${rad} 0 0 1 ${rad},${rad}v${h - 2 * rad}a${rad},${rad} 0 0 1 -${rad},${rad}h-${w - rad}z`, fill: "var(--mark)" });
    const val = el("text", { x: m.l + w + 6, y: y + h / 2 + 4, visibility: i === 0 ? "visible" : "hidden" }, fmt(r[s.y]));
    const hit = el("rect", { x: 0, y: y - 2, width: W, height: band, fill: "transparent" });
    hit.onmousemove = (e) => { bar.setAttribute("fill", "var(--accent)"); val.setAttribute("visibility", "visible");
      showTip(e, `<div class="k">${label}</div><b>${fmt(r[s.y])}</b> <span class="k">${Q.columns[s.y][0]}</span>`); };
    hit.onmouseleave = () => { bar.setAttribute("fill", "var(--mark)"); if (i) val.setAttribute("visibility", "hidden"); hideTip(); };
    svg.append(bar, val, hit);
  });
}

function drawScatter(stage, Q, s) {
  const title = document.createElement("div"); title.className = "title";
  title.textContent = `${Q.columns[s.y][0]} against ${Q.columns[s.x][0]}`; stage.append(title);
  const H = 380, m = { l: 56, r: 16, t: 10, b: 36 };
  const [svg, W] = frame(stage, H);
  const xt = ticks(Math.max(...Q.rows.map((r) => +r[s.x]))), yt = ticks(Math.max(...Q.rows.map((r) => +r[s.y])));
  const X = (v) => m.l + (v / xt.at(-1)) * (W - m.l - m.r), Y = (v) => H - m.b - (v / yt.at(-1)) * (H - m.t - m.b);
  for (const t of yt) { svg.append(el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t ? "var(--grid)" : "var(--line)" }));
    svg.append(el("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, fmt(t))); }
  for (const t of xt) svg.append(el("text", { x: X(t), y: H - 18, "text-anchor": "middle" }, fmt(t)));
  svg.append(el("text", { x: W - m.r, y: H - 2, "text-anchor": "end" }, Q.columns[s.x][0] + " →"));
  svg.append(el("text", { x: m.l + 8, y: m.t + 12, "text-anchor": "start" }, "↑ " + Q.columns[s.y][0]));
  const pts = Q.rows.map((r) => ({ r, x: X(+r[s.x]), y: Y(+r[s.y]) }));
  for (const p of pts) svg.append(el("circle", { cx: p.x, cy: p.y, r: 4, fill: "var(--mark)", "fill-opacity": 0.55, stroke: "var(--surface)", "stroke-width": 1 }));
  const hot = el("circle", { r: 5.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }); svg.append(hot);
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }); svg.append(hit);
  hit.onmousemove = (e) => {
    let best = null, bd = 14 ** 2;
    for (const p of pts) { const d = (p.x - e.offsetX) ** 2 + (p.y - e.offsetY) ** 2; if (d < bd) (bd = d), (best = p); }
    if (!best) { hot.setAttribute("visibility", "hidden"); return hideTip(); }
    hot.setAttribute("cx", best.x); hot.setAttribute("cy", best.y); hot.setAttribute("visibility", "visible");
    showTip(e, (s.label != null ? `<div>${best.r[s.label]}</div>` : "") +
      `<div><span class="k">${Q.columns[s.x][0]}</span> <b>${fmt(best.r[s.x])}</b></div><div><span class="k">${Q.columns[s.y][0]}</span> <b>${fmt(best.r[s.y])}</b></div>`);
  };
  hit.onmouseleave = () => { hot.setAttribute("visibility", "hidden"); hideTip(); };
}

function drawValue(stage, Q, s) {
  stage.append(Object.assign(document.createElement("div"), { className: "hero", textContent: fmt(Q.rows[0][s.y]) }));
  stage.append(Object.assign(document.createElement("div"), { className: "muted", textContent: Q.columns[s.y][0] }));
}

function drawTable(stage, Q) {
  const t = document.createElement("table");
  t.innerHTML = "<tr>" + Q.columns.map(([n]) => `<th>${n}</th>`).join("") + "</tr>" +
    Q.rows.slice(0, 200).map((r) => "<tr>" + r.map((v, i) => `<td class="${kind(Q.columns[i][1]) === "number" ? "num" : ""}">${v ?? "NULL"}</td>`).join("") + "</tr>").join("");
  stage.append(t);
}

function select(i) {
  state = { q: i, spec: pick(QUERIES[i].columns) };
  $("list").querySelectorAll(".q").forEach((b, j) => b.classList.toggle("active", j === i));
  render();
}
QUERIES.forEach((Q, i) => { const b = document.createElement("button"); b.className = "q";
  b.innerHTML = `${Q.name}<small>${Q.note}</small>`; b.onclick = () => select(i); $("list").append(b); });
for (const th of ["Light", "Dark"]) { const b = document.createElement("button"); b.textContent = th;
  b.onclick = () => { document.documentElement.dataset.theme = th.toLowerCase(); $("theme").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
  $("theme").append(b); }
$("theme").firstChild.classList.add("on");
addEventListener("resize", render);
select(0);
</script>
</body>
</html>
