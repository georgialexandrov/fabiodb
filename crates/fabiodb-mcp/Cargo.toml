[package]
name = "fabiodb-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fabio's MCP server: agents query your databases read-only, and the app shows every statement"

[dependencies]
fabiodb-core = { path = "../fabiodb-core" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
